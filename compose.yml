services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: rakamin_development
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
  api:
    build: ./api
    ports: ["127.0.0.1:3001:3001"]
    environment: &api_env
      DB_HOST: db
      DB_USERNAME: postgres
      DB_NAME: rakamin_development
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?Set a local signing secret in your shell}
      REDIS_URL: redis://redis:6379/1
      ALLOWED_ORIGINS: http://localhost:5173
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
  worker:
    build: ./api
    command: bundle exec sidekiq -r ./config/environment.rb -C config/sidekiq.yml
    environment: *api_env
    depends_on: [api]
  web:
    image: node:22-alpine
    working_dir: /app
    volumes: ["./web:/app", "web_modules:/app/node_modules"]
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports: ["127.0.0.1:5173:5173"]
    environment:
      VITE_API_BASE_URL: http://localhost:3001/api/v1
      VITE_WS_BASE_URL: ws://localhost:3001
volumes:
  pgdata:
  web_modules:
